version: '3.8'

networks:
  healthinsurechain:
    driver: bridge

services:
  # Orderer Service
  orderer.healthinsurechain.com:
    container_name: orderer.healthinsurechain.com
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_HOME=/var/hyperledger/orderer
      - ORDERER_HOST=orderer.healthinsurechain.com
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_KAFKA_TOPIC_REPLICATIONFACTOR=1
      - ORDERER_KAFKA_VERBOSE=true
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./crypto-config/ordererOrganizations/healthinsurechain.com/orderers/orderer.healthinsurechain.com/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/healthinsurechain.com/orderers/orderer.healthinsurechain.com/tls/:/var/hyperledger/orderer/tls
    ports:
      - 7050:7050
    networks:
      - healthinsurechain

  # Hospital Organization
  peer0.hospital.healthinsurechain.com:
    container_name: peer0.hospital.healthinsurechain.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=healthinsurechain_healthinsurechain
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.hospital.healthinsurechain.com
      - CORE_PEER_ADDRESS=peer0.hospital.healthinsurechain.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.hospital.healthinsurechain.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.hospital.healthinsurechain.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.hospital.healthinsurechain.com:7051
      - CORE_PEER_LOCALMSPID=HospitalMSP
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/hospital.healthinsurechain.com/peers/peer0.hospital.healthinsurechain.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/hospital.healthinsurechain.com/peers/peer0.hospital.healthinsurechain.com/tls/:/etc/hyperledger/fabric/tls
      - peer0_hospital:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 7051:7051
    depends_on:
      - orderer.healthinsurechain.com
    networks:
      - healthinsurechain

  # Insurance Organization
  peer0.insurance.healthinsurechain.com:
    container_name: peer0.insurance.healthinsurechain.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=healthinsurechain_healthinsurechain
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.insurance.healthinsurechain.com
      - CORE_PEER_ADDRESS=peer0.insurance.healthinsurechain.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.insurance.healthinsurechain.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.insurance.healthinsurechain.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.insurance.healthinsurechain.com:7051
      - CORE_PEER_LOCALMSPID=InsuranceMSP
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/insurance.healthinsurechain.com/peers/peer0.insurance.healthinsurechain.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/insurance.healthinsurechain.com/peers/peer0.insurance.healthinsurechain.com/tls/:/etc/hyperledger/fabric/tls
      - peer0_insurance:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 8051:7051
    depends_on:
      - orderer.healthinsurechain.com
    networks:
      - healthinsurechain

  # Hospital CA
  ca.hospital.healthinsurechain.com:
    image: hyperledger/fabric-ca:1.5
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-hospital
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - 7054:7054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./crypto-config/peerOrganizations/hospital.healthinsurechain.com/ca/:/etc/hyperledger/fabric-ca-server-config
    container_name: ca.hospital.healthinsurechain.com
    networks:
      - healthinsurechain

  # Insurance CA
  ca.insurance.healthinsurechain.com:
    image: hyperledger/fabric-ca:1.5
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-insurance
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - 8054:7054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./crypto-config/peerOrganizations/insurance.healthinsurechain.com/ca/:/etc/hyperledger/fabric-ca-server-config
    container_name: ca.insurance.healthinsurechain.com
    networks:
      - healthinsurechain

  # CLI Container for Hospital
  cli.hospital:
    container_name: cli.hospital
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli.hospital
      - CORE_PEER_ADDRESS=peer0.hospital.healthinsurechain.com:7051
      - CORE_PEER_LOCALMSPID=HospitalMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/hospital.healthinsurechain.com/peers/peer0.hospital.healthinsurechain.com/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/hospital.healthinsurechain.com/peers/peer0.hospital.healthinsurechain.com/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/hospital.healthinsurechain.com/peers/peer0.hospital.healthinsurechain.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/hospital.healthinsurechain.com/users/Admin@hospital.healthinsurechain.com/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/:/host/var/run/
      - ./../chaincode:/opt/gopath/src/github.com/chaincode
      - ./crypto-config:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/
      - ./scripts:/opt/gopath/src/github.com/hyperledger/fabric/peer/scripts/
      - ./channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
    depends_on:
      - peer0.hospital.healthinsurechain.com
    networks:
      - healthinsurechain

volumes:
  peer0_hospital:
  peer0_insurance:
